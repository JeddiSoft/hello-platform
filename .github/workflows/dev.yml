name: Dev CI

on:
  push:
    branches:
      - "feature/**"
    paths-ignore:
      - "k8s/dev/deployment.yaml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/hello-platform:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/hello-platform:${{ github.sha }}

  update-manifest:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update dev image tag
        run: |
          sed -i \
            "s|image: ghcr.io/ajezziriglos-bot/hello-platform:.*|image: ghcr.io/ajezziriglos-bot/hello-platform:${{ github.sha }}|" \
            k8s/dev/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/dev/deployment.yaml

          git diff --cached --quiet || \
            git commit -m "chore: deploy dev image ${{ github.sha }}"

          git push
          