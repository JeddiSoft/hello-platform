name: Prod CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/prod/deployment.yaml"

jobs:

  promote:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image deployed in DEV
        id: image
        run: |
          DEV_IMAGE=$(grep 'image:' k8s/dev/deployment.yaml | awk '{print $2}')

          echo "Promoting image: $DEV_IMAGE"
          echo "image=$DEV_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image exists
        run: |
          docker manifest inspect "${{ steps.image.outputs.image }}"

      - name: Update PROD manifest
        run: |
          sed -i \
            "s|image: ghcr.io/ajezziriglos-bot/hello-platform:.*|image: ${{ steps.image.outputs.image }}|" \
            k8s/prod/deployment.yaml

      - name: Commit PROD promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/prod/deployment.yaml

          git diff --cached --quiet || \
            git commit -m "chore: promote image to prod"

          git push