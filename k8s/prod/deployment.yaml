apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-platform
  namespace: hello-prod

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hello-platform

  template:
    metadata:
      labels:
        app: hello-platform

    spec:
      containers:
        - name: hello-platform
          image: ghcr.io/ajezziriglos-bot/hello-platform:3e3d342a257857907f49b8a1826025ac85c564f0

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: 8000