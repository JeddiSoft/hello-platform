name: Dev CI

on:
  push:
    branches:
      - "feature/**"
    paths-ignore:
      - "k8s/dev/deployment.yaml"

  pull_request:
    branches:
      - main    

jobs:

  platform-ci:
    uses: ajezziriglos-bot/platform-workflows/.github/workflows/python-kubernetes-ci.yml@main
    permissions:
      contents: read
      packages: write

  update-manifest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: platform-ci
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update dev image tag
        run: |
          sed -i \
            "s|image: ghcr.io/ajezziriglos-bot/hello-platform:.*|image: ghcr.io/ajezziriglos-bot/hello-platform:${{ github.sha }}|" \
            k8s/dev/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/dev/deployment.yaml

          git diff --cached --quiet || \
            git commit -m "chore: deploy dev image ${{ github.sha }}"

          git push